name: Deploy truth-release DAG to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      truth_release_digest:
        description: "sha256 release digest, or mock for the committed smoke fixture"
        required: false
        default: mock
        type: string
      reconcile:
        description: "Select the oldest missing published release (limit 1); digest input is a wake-up hint"
        required: false
        default: false
        type: boolean
      rebuild_current:
        description: "Rebuild and redeploy the served Library current release with this Pages revision (overrides digest/reconcile)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-truth-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.selection.outputs.should_build }}
      release_digest: ${{ steps.selection.outputs.release_digest }}
      source_commit: ${{ steps.selection.outputs.source_commit }}
      rebuild: ${{ steps.selection.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install content parsers
        run: python -m pip install -r requirements.txt

      - name: Reconcile metadata before any bundle or topology work
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DIGEST: ${{ inputs.truth_release_digest || 'mock' }}
          RECONCILE: ${{ inputs.reconcile || false }}
          REBUILD_CURRENT: ${{ inputs.rebuild_current || false }}
        shell: bash
        run: |
          set -euo pipefail
          requested=(--limit 1)
          if [[ "$REBUILD_CURRENT" == 'true' ]]; then
            requested+=(--rebuild-current)
          elif [[ "$RECONCILE" != 'true' ]]; then
            if [[ "$REQUESTED_DIGEST" == 'mock' ]]; then
              printf 'should_build=true\nrelease_digest=mock\nsource_commit=\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            requested+=(--requested-digest "$REQUESTED_DIGEST")
          fi
          python -m lib.reconcile_releases plan \
            --previous-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
            "${requested[@]}" --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/reconciliation.json"
          cat "$RUNNER_TEMP/reconciliation.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Observe version status even when no release is eligible
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m lib.version_status --output "$RUNNER_TEMP/version-observation" \
            --previous-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the reconciliation status observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-status-reconciliation
          path: ${{ runner.temp }}/version-observation/data/version-status.v1.json
          if-no-files-found: warn

  deploy:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPOLOGY_VERSION: 0.2.0-alpha.1
      TOPOLOGY_PRODUCER_COMMIT: dbd407d52806b4a87bb3c129f810a10d438a2b53
      TRUTH_REPOSITORY: the-omega-institute/trureturing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install content parsers
        run: python -m pip install -r requirements.txt

      - name: Restore a completed ingestion if deployment was interrupted
        id: checkpoint
        if: needs.prepare.outputs.release_digest != 'mock' && needs.prepare.outputs.rebuild != 'true'
        uses: actions/cache/restore@v4
        with:
          path: _site
          key: pages-ingestion-v1-${{ github.sha }}-${{ needs.prepare.outputs.release_digest }}

      - name: Verify the recovered site's release and Library bindings
        if: steps.checkpoint.outputs.cache-hit == 'true'
        run: >-
          python -m lib.reconcile_releases check-checkpoint
          --digest '${{ needs.prepare.outputs.release_digest }}' --output _site
          --previous-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Acquire the digest-addressed truth-release
        if: steps.checkpoint.outputs.cache-hit != 'true'
        id: acquire
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DIGEST: ${{ needs.prepare.outputs.release_digest }}
          PLANNED_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/truth-release"
          if [[ -z "$REQUESTED_DIGEST" || "$REQUESTED_DIGEST" == 'mock' ]]; then
            cp -R tests/fixtures/truth-release "$bundle"
            expected='mock'
            blueprint_ref='dev'
          else
            [[ "$REQUESTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { printf '%s\n' 'truth_release_digest must be mock or sha256:<64 lowercase hex>' >&2; exit 1; }
            python -m lib.reconcile_releases acquire \
              --digest "$REQUESTED_DIGEST" --source-commit "$PLANNED_SOURCE_COMMIT" \
              --repository "$TRUTH_REPOSITORY" --bundle "$bundle" --output _site \
              --previous-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
              ${{ needs.prepare.outputs.rebuild == 'true' && '--rebuild-current' || '' }} \
              --verified-json "$RUNNER_TEMP/verified-release.json"
            expected="$REQUESTED_DIGEST"
          fi
          python -m lib.vertical_smoke verify "$bundle" \
            --expected-digest "$expected" \
            --output "$RUNNER_TEMP/verified-release.json"
          release_digest="$(jq -r '.release_digest' "$RUNNER_TEMP/verified-release.json")"
          source_commit="$(jq -r '.source_commit' "$RUNNER_TEMP/verified-release.json")"
          source_tree="$(jq -r '.source_tree' "$RUNNER_TEMP/verified-release.json")"
          if [[ "$expected" != 'mock' ]]; then
            blueprint_ref="$source_commit"
          fi
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'release_digest=%s\n' "$release_digest" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'blueprint_ref=%s\n' "$blueprint_ref" >> "$GITHUB_OUTPUT"
          printf 'ACQUIRED release_digest=%s source_commit=%s blueprint_ref=%s\n' \
            "$release_digest" "$source_commit" "$blueprint_ref"

      - name: Checkout Blueprint source at the exact truth-release commit
        if: steps.checkpoint.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: the-omega-institute/trureturing
          ref: ${{ steps.acquire.outputs.blueprint_ref }}
          path: _upstream
          sparse-checkout: |
            Blueprint
            Problems
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        if: steps.checkpoint.outputs.cache-hit != 'true'
        with:
          global-json-file: global.json

      - name: Restore the versioned Pages and Topology package graph
        if: steps.checkpoint.outputs.cache-hit != 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_READ_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
        run: dotnet restore Trureturing.Pages.slnx --configfile nuget.config

      - name: Build Pages and its package-backed Topology runner
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: dotnet build Trureturing.Pages.slnx -c Release --no-restore --warnaserror

      - name: Render the basic release DAG
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: python -m lib.vertical_smoke build-basic '${{ steps.acquire.outputs.bundle }}' _site

      - name: Enrich the DAG and render release-bound concept pages
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: |
          python lib/human_labels.py \
            _site/data/basic-truth-graph.v1.json \
            _site/data/basic-truth-graph.v1.json \
            _upstream/Blueprint \
            --blueprint-ref '${{ steps.acquire.outputs.blueprint_ref }}'
          python lib/human_labels.py \
            _site/data/truth-graph.v1.json \
            _site/data/truth-graph.v1.json \
            _upstream/Blueprint \
            --blueprint-ref '${{ steps.acquire.outputs.blueprint_ref }}'
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site")
          graph = json.loads(
              (root / "data/truth-graph.v1.json").read_text(encoding="utf-8")
          )
          current = list((root / "knowledge/node").glob("*/index.html"))
          immutable = list((root / "release").glob("*/node/*/index.html"))
          assert len(current) == len(graph["nodes"])
          assert len(immutable) == len(graph["nodes"])
          if not graph.get("synthetic"):
              assert graph["human_labels"]["blueprint_ref"] == (
                  graph["source_snapshot"]["source_commit"]
              )
          PY

      - name: Produce and measure certified topology
        if: steps.checkpoint.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          topology_runner="tools/Trureturing.Topology.Runner/bin/Release/net10.0/Trureturing.Topology.Runner.dll"
          topology="$RUNNER_TEMP/certified-topology.v1.json"
          metrics="$RUNNER_TEMP/topology-measurement.json"
          /usr/bin/time \
            -f '{"schema":"topology-measurement.v1","elapsed_seconds":%e,"max_rss_kib":%M}' \
            -o "$metrics" \
            dotnet "$topology_runner" certified \
              '${{ steps.acquire.outputs.bundle }}/truth-graph.v1.json' \
              '${{ steps.acquire.outputs.release_digest }}' \
              config/algorithm-profile.v1.json \
              "$TOPOLOGY_PRODUCER_COMMIT" \
              "$topology"
          jq -e '.schema == "topology-measurement.v1" and .elapsed_seconds >= 0 and .max_rss_kib > 0' "$metrics" >/dev/null
          cp "$topology" _site/data/certified-topology.v1.json
          printf 'TOPOLOGY_MEASUREMENT %s\n' "$(jq -c . "$metrics")"

      - name: Produce the deterministic multiscale Topology Atlas
        if: steps.checkpoint.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          topology_runner="tools/Trureturing.Topology.Runner/bin/Release/net10.0/Trureturing.Topology.Runner.dll"
          dotnet "$topology_runner" atlas \
            '${{ steps.acquire.outputs.bundle }}/truth-graph.v1.json' \
            '${{ steps.acquire.outputs.release_digest }}' \
            config/algorithm-profile.v1.json \
            config/topology-atlas-profile.v1.json \
            "$TOPOLOGY_PRODUCER_COMMIT" \
            _site/data/topology-atlas.v1.json
          jq -e \
            --arg release '${{ steps.acquire.outputs.release_digest }}' \
            --arg producer "$TOPOLOGY_PRODUCER_COMMIT" \
            '.schema_version == "topology-atlas.v1"
              and .truth_release_digest == $release
              and .producer_commit == $producer
              and (.hierarchy | length) == 3
              and (.node_structure | length) > 0' \
            _site/data/topology-atlas.v1.json >/dev/null

      - name: Project and conform one release-bound multiscale Pages Atlas
        id: projection
        if: steps.checkpoint.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/Trureturing.Pages.Cli/bin/Release/net10.0/Trureturing.Pages.Cli.dll \
            project-atlas \
            _site/data/truth-graph.v1.json \
            _site/data/certified-topology.v1.json \
            _site/data/pages-atlas-view.v1.json \
            _site/data/pages-atlas-manifest.v1.json \
            _site/data/topology-atlas.v1.json

          previous="$RUNNER_TEMP/previous-pages-conformation.v1.json"
          previous_arg='-'
          previous_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/pages-conformation.v1.json?run=${GITHUB_RUN_ID}"
          status="$(curl -sS -L --max-filesize 16777216 -o "$previous" -w '%{http_code}' "$previous_url")"
          if [[ "$status" == '200' ]]; then
            if jq -e \
              '.schema_version == "pages-conformation.v1"
                and .layout_profile.name == "pages-topology-atlas-fixed-point-v1"
                and .coordinate_encoding.type == "signed-fixed-point"
                and .coordinate_encoding.scale == 1000
                and .structure_source == "topology-atlas.v1"' \
              "$previous" >/dev/null; then
              previous_arg="$previous"
              printf 'CONFORMATION_ALIGNMENT previous=%s\n' \
                "sha256:$(sha256sum "$previous" | cut -d ' ' -f 1)"
            else
              printf '%s\n' 'Existing Pages conformation uses an incompatible profile; starting from intrinsic placement.'
            fi
          elif [[ "$status" != '404' ]]; then
            printf 'cannot establish previous Pages conformation: HTTP %s\n' "$status" >&2
            exit 1
          fi

          cp _site/data/pages-atlas-manifest.v1.json \
            "$RUNNER_TEMP/pages-atlas-manifest.unbound.json"
          dotnet src/Trureturing.Pages.Cli/bin/Release/net10.0/Trureturing.Pages.Cli.dll \
            conform-atlas \
            _site/data/pages-atlas-view.v1.json \
            "$RUNNER_TEMP/pages-atlas-manifest.unbound.json" \
            _site/data/pages-conformation.v1.json \
            "$RUNNER_TEMP/pages-atlas-manifest.bound.json" \
            "$previous_arg"
          mv "$RUNNER_TEMP/pages-atlas-manifest.bound.json" \
            _site/data/pages-atlas-manifest.v1.json
          cp _site/data/pages-atlas-view.v1.json \
            _site/data/certified-topology-view.v1.json
          cp _site/data/pages-atlas-view.v1.json \
            _site/data/truth-graph.v1.json
          cmp _site/data/pages-atlas-view.v1.json \
            _site/data/certified-topology-view.v1.json
          cmp _site/data/pages-atlas-view.v1.json \
            _site/data/truth-graph.v1.json

          topology_atlas_digest="sha256:$(sha256sum _site/data/topology-atlas.v1.json | cut -d ' ' -f 1)"
          conformation_digest="sha256:$(sha256sum _site/data/pages-conformation.v1.json | cut -d ' ' -f 1)"
          jq -e \
            --arg release '${{ steps.acquire.outputs.release_digest }}' \
            --arg topology_atlas "$topology_atlas_digest" \
            --arg conformation "$conformation_digest" \
            '.schema_version == "pages-atlas-manifest.v1"
              and .truth_release_digest == $release
              and .projection_profile == "pages-atlas-projection-v1"
              and .graph_path == "data/pages-atlas-view.v1.json"
              and .topology_atlas_digest == $topology_atlas
              and .conformation_digest == $conformation' \
            _site/data/pages-atlas-manifest.v1.json >/dev/null
          jq -e \
            --arg release '${{ steps.acquire.outputs.release_digest }}' \
            --arg topology_atlas "$topology_atlas_digest" \
            '.schema_version == "pages-conformation.v1"
              and .truth_release_digest == $release
              and .topology_atlas_digest == $topology_atlas
              and .structure_source == "topology-atlas.v1"
              and .layout_profile.name == "pages-topology-atlas-fixed-point-v1"
              and .coordinate_encoding.type == "signed-fixed-point"
              and .coordinate_encoding.scale == 1000
              and .axes.depth_axis == "y"
              and .axes.depth_step == 180000' \
            _site/data/pages-conformation.v1.json >/dev/null

      - name: Precompute public Atlas layout and cacheable startup artifacts
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: >-
          node tools/build_atlas_startup.mjs
          _site/data/pages-atlas-view.v1.json
          _site/data/pages-atlas-manifest.v1.json _site

      - name: Render Wiki relationships from the final verified Atlas
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: >-
          python -m lib.knowledge_pages
          _site/data/pages-atlas-view.v1.json _site
          --manifest _site/data/pages-atlas-manifest.v1.json

      - name: Preserve architecture observations and append the verified release
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: >-
          node tools/build_architecture_history.mjs
          _site/data/pages-atlas-view.v1.json
          _site/data/pages-atlas-manifest.v1.json _site
          https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Repair duplicate Library projection coordinates before backfill
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: |
          python -m lib.reconcile_releases repair-history \
            --output _site \
            --previous-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ \
            --for-deployment > "$RUNNER_TEMP/library-history-repair.json"
          cat "$RUNNER_TEMP/library-history-repair.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive content and publish source-bound research dossiers
        id: ingestion
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: >-
          python -m lib.reconcile_releases ingest
          --bundle '${{ steps.acquire.outputs.bundle }}'
          --digest '${{ steps.acquire.outputs.release_digest }}'
          --graph _site/data/pages-atlas-view.v1.json
          --manifest _site/data/pages-atlas-manifest.v1.json --output _site
          --source-repo _upstream
          --previous-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          --for-deployment
          ${{ needs.prepare.outputs.rebuild == 'true' && '--rebuild-current' || '' }}

      - name: Verify the ingestion receipt is staged in the Pages artifact
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: test -s _site/data/ingestion-receipts.v1.json

      - name: Finalize the release-bound Pages deployment
        if: steps.checkpoint.outputs.cache-hit != 'true'
        run: |
          pages_commit="$(git rev-parse HEAD)"
          pages_tree="$(git rev-parse HEAD^{tree})"
          python -m lib.vertical_smoke finalize \
            _site \
            _site/data/certified-topology.v1.json \
            "$pages_commit" \
            "$pages_tree" \
            --metrics "$RUNNER_TEMP/topology-measurement.json"

      - name: Save the completed site so a deployment retry does not repeat ingestion
        if: steps.checkpoint.outputs.cache-hit != 'true' && needs.prepare.outputs.release_digest != 'mock' && needs.prepare.outputs.rebuild != 'true'
        uses: actions/cache/save@v4
        with:
          path: _site
          key: pages-ingestion-v1-${{ github.sha }}-${{ needs.prepare.outputs.release_digest }}

      - name: Stage version status with the complete Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m lib.version_status --output _site --for-deployment \
            --previous-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
            >> "$GITHUB_STEP_SUMMARY"
          test -s _site/data/version-status.v1.json

      - name: Refuse stale release or topology deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/current-deployment-manifest.json"
          status="$(curl -sS -L --max-filesize 65536 \
            -o "$current" -w '%{http_code}' \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/deployment-manifest.v1.json?run=${GITHUB_RUN_ID}")"
          current_args=()
          if [[ "$status" == '200' ]]; then
            current_args=(--current "$current")
          elif [[ "$status" != '404' ]]; then
            printf 'cannot establish deployed state: Pages manifest returned HTTP %s\n' "$status" >&2
            exit 1
          fi
          decision="$RUNNER_TEMP/freshness-decision.json"
          python -m lib.vertical_smoke freshness \
            _site/deployment-manifest.v1.json \
            "${current_args[@]}" \
            --output "$decision"
          if [[ "$(jq -r '.requires_ancestry_check' "$decision")" == 'true' ]]; then
            current_commit="$(jq -r '.current_source_commit' "$decision")"
            incoming_commit="$(jq -r '.incoming_source_commit' "$decision")"
            comparison="$RUNNER_TEMP/source-comparison.json"
            gh api "repos/${TRUTH_REPOSITORY}/compare/${current_commit}...${incoming_commit}" > "$comparison"
            jq -e \
              --arg current "$current_commit" \
              '.merge_base_commit.sha == $current and .status == "ahead" and .behind_by == 0' \
              "$comparison" >/dev/null \
              || { printf '%s\n' 'incoming release source is not newer than deployed source; refusing deploy' >&2; exit 1; }
          fi
          printf 'DEPLOY_FRESHNESS %s\n' "$(jq -c . "$decision")"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy the unified multiscale Atlas and concept state
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Observe the stopped stage without changing the served site
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIGEST: ${{ needs.prepare.outputs.release_digest }}
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
          INGESTION_OUTCOME: ${{ steps.ingestion.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failure=()
          stage=''
          reason=''
          if [[ "$ACQUIRE_OUTCOME" == 'failure' ]]; then
            stage='received'; reason='acquisition-failed'
          elif [[ "$PROJECTION_OUTCOME" == 'failure' ]]; then
            stage='generated'; reason='generation-failed'
          elif [[ "$INGESTION_OUTCOME" == 'failure' ]]; then
            stage='received'; reason='atomic-ingestion-failed'
          elif [[ "$DEPLOYMENT_OUTCOME" == 'failure' ]]; then
            stage='deployed'; reason='deployment-failed'
          fi
          if [[ "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && -n "$stage" ]]; then
            failure=(--failure-digest "$RELEASE_DIGEST" --failure-stage "$stage" --failure-reason "$reason")
          fi
          python -m lib.version_status --output _site \
            --previous-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
            "${failure[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the build or deployment status for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-status-build
          path: _site/data/version-status.v1.json
          if-no-files-found: warn
