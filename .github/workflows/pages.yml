name: Deploy truth-release DAG to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      truth_release_digest:
        description: "sha256 release digest, or mock for the committed smoke fixture"
        required: false
        default: mock
        type: string

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-truth-release
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPOLOGY_VERSION: 0.1.0-alpha.1
      TOPOLOGY_PRODUCER_COMMIT: 28375f4a25fec6fd4777da1d7a7b1b8a9e0d8f3b
      TRUTH_REPOSITORY: the-omega-institute/trureturing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire the digest-addressed truth-release
        id: acquire
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DIGEST: ${{ inputs.truth_release_digest || 'mock' }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/truth-release"
          if [[ -z "$REQUESTED_DIGEST" || "$REQUESTED_DIGEST" == 'mock' ]]; then
            cp -R tests/fixtures/truth-release "$bundle"
            expected='mock'
          else
            [[ "$REQUESTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { printf '%s\n' 'truth_release_digest must be mock or sha256:<64 lowercase hex>' >&2; exit 1; }
            assets="$RUNNER_TEMP/truth-release-assets"
            mkdir "$assets"
            release_tag="truth-release-${REQUESTED_DIGEST#sha256:}"
            archive="truth-release-${REQUESTED_DIGEST#sha256:}.tar.gz"
            gh release download "$release_tag" \
              --repo "$TRUTH_REPOSITORY" \
              --pattern "$archive" \
              --dir "$assets"
            python -m lib.vertical_smoke extract "$assets/$archive" "$bundle"
            expected="$REQUESTED_DIGEST"
          fi
          python -m lib.vertical_smoke verify "$bundle" \
            --expected-digest "$expected" \
            --output "$RUNNER_TEMP/verified-release.json"
          release_digest="$(jq -r '.release_digest' "$RUNNER_TEMP/verified-release.json")"
          source_commit="$(jq -r '.source_commit' "$RUNNER_TEMP/verified-release.json")"
          source_tree="$(jq -r '.source_tree' "$RUNNER_TEMP/verified-release.json")"
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'release_digest=%s\n' "$release_digest" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'ACQUIRED release_digest=%s source_commit=%s\n' "$release_digest" "$source_commit"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore the pinned topology package and Pages projects
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet restore Trureturing.Pages.slnx --configfile nuget.config

      - name: Build only Pages and its topology runner
        run: dotnet build Trureturing.Pages.slnx -c Release --no-restore --warnaserror

      - name: Render the basic release DAG
        run: python -m lib.vertical_smoke build-basic '${{ steps.acquire.outputs.bundle }}' _site

      - name: Run and measure the pinned C# topology engine
        shell: bash
        run: |
          set -euo pipefail
          topology="$RUNNER_TEMP/certified-topology.v1.json"
          metrics="$RUNNER_TEMP/topology-measurement.json"
          /usr/bin/time \
            -f '{"schema":"topology-measurement.v1","elapsed_seconds":%e,"max_rss_kib":%M}' \
            -o "$metrics" \
            dotnet tools/Trureturing.Topology.Runner/bin/Release/net10.0/Trureturing.Topology.Runner.dll \
              '${{ steps.acquire.outputs.bundle }}/truth-graph.v1.json' \
              '${{ steps.acquire.outputs.release_digest }}' \
              config/algorithm-profile.v1.json \
              "$TOPOLOGY_PRODUCER_COMMIT" \
              "$topology"
          jq -e '.schema == "topology-measurement.v1" and .elapsed_seconds >= 0 and .max_rss_kib > 0' "$metrics" >/dev/null
          cp "$topology" _site/data/certified-topology.v1.json
          printf 'TOPOLOGY_MEASUREMENT %s\n' "$(jq -c . "$metrics")"

      - name: Render the topology-enriched DAG through the Pages consumer
        run: |
          python -m lib.certified_topology \
            _site/data/basic-truth-graph.v1.json \
            _site/data/certified-topology.v1.json \
            _site/data/certified-topology-view.v1.json
          pages_commit="$(git rev-parse HEAD)"
          pages_tree="$(git rev-parse HEAD^{tree})"
          python -m lib.vertical_smoke finalize \
            _site \
            _site/data/certified-topology.v1.json \
            "$pages_commit" \
            "$pages_tree" \
            --metrics "$RUNNER_TEMP/topology-measurement.json"

      - name: Refuse stale release or topology deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/current-deployment-manifest.json"
          status="$(curl -sS -L --max-filesize 65536 \
            -o "$current" -w '%{http_code}' \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/deployment-manifest.v1.json?run=${GITHUB_RUN_ID}")"
          current_args=()
          if [[ "$status" == '200' ]]; then
            current_args=(--current "$current")
          elif [[ "$status" != '404' ]]; then
            printf 'cannot establish deployed state: Pages manifest returned HTTP %s\n' "$status" >&2
            exit 1
          fi
          decision="$RUNNER_TEMP/freshness-decision.json"
          python -m lib.vertical_smoke freshness \
            _site/deployment-manifest.v1.json \
            "${current_args[@]}" \
            --output "$decision"
          if [[ "$(jq -r '.requires_ancestry_check' "$decision")" == 'true' ]]; then
            current_commit="$(jq -r '.current_source_commit' "$decision")"
            incoming_commit="$(jq -r '.incoming_source_commit' "$decision")"
            comparison="$RUNNER_TEMP/source-comparison.json"
            gh api "repos/${TRUTH_REPOSITORY}/compare/${current_commit}...${incoming_commit}" > "$comparison"
            jq -e \
              --arg current "$current_commit" \
              '.merge_base_commit.sha == $current and .status == "ahead" and .behind_by == 0' \
              "$comparison" >/dev/null \
              || { printf '%s\n' 'incoming release source is not newer than deployed source; refusing deploy' >&2; exit 1; }
          fi
          printf 'DEPLOY_FRESHNESS %s\n' "$(jq -c . "$decision")"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy the unified basic and enriched site state
        id: deployment
        uses: actions/deploy-pages@v4
