name: Display health and maintenance
on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
    inputs:
      verify_model:
        description: 'Also exercise the read-only NyxID model route when probes are healthy'
        type: boolean
        default: false
  workflow_run:
    workflows: ['Deploy truth-release DAG to GitHub Pages']
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    uses: the-omega-institute/.github/.github/workflows/display-monitor.yml@56ee6371142e06be0494248733408a917f5e553e
    with:
      monitor_revision: 56ee6371142e06be0494248733408a917f5e553e
      verify_model: ${{ inputs.verify_model || false }}
    secrets:
      model_key: ${{ secrets.NYXID_MONITOR_KEY }}
      github_key: ${{ secrets.NYXID_MONITOR_GITHUB_KEY }}
