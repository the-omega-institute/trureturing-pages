name: Delegate release-bound Pages deployment

on:
  workflow_dispatch:
    inputs:
      truth_release_digest:
        description: "sha256 release digest, or mock for the committed smoke fixture"
        required: false
        default: mock
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: delegate-pages-${{ inputs.truth_release_digest || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release coordinate
        id: input
        env:
          TRUTH_RELEASE_DIGEST: ${{ inputs.truth_release_digest || 'mock' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRUTH_RELEASE_DIGEST" != 'mock' ]]; then
            [[ "$TRUTH_RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { printf '%s\n' 'truth_release_digest must be mock or sha256:<64 lowercase hex>' >&2; exit 1; }
          fi
          printf 'truth_release_digest=%s\n' \
            "$TRUTH_RELEASE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Dispatch the canonical release-bound pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          TRUTH_RELEASE_DIGEST: ${{ steps.input.outputs.truth_release_digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref dev \
            -f "truth_release_digest=$TRUTH_RELEASE_DIGEST"

      - name: Record the delegated coordinate
        env:
          TRUTH_RELEASE_DIGEST: ${{ steps.input.outputs.truth_release_digest }}
        run: |
          {
            echo '## Delegated Pages deployment'
            echo
            echo "- Release coordinate: \`$TRUTH_RELEASE_DIGEST\`"
            echo '- Canonical build and deployment workflow: `pages.yml` on `dev`'
            echo '- This workflow performs no projection or direct deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
