name: Reconcile published truth releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: schedule-truth-release-reconciliation
  cancel-in-progress: false

jobs:
  schedule-one:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request one bounded reconciliation in the existing Pages pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref dev \
            -f reconcile=true
          printf '%s\n' 'Requested pages.yml reconciliation on dev (limit 1). This is a scheduling acknowledgement, not an ingestion receipt.' >> "$GITHUB_STEP_SUMMARY"
