name: finalize-save-observation

on:
  push:
    branches:
      - feat/save-structural-observations
    paths:
      - .github/workflows/finalize-save-observation.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/save-structural-observations
          fetch-depth: 0
      - name: Finalize assets, tests, and stacked PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin feat/save-structural-observations
          python - <<'PY'
          from pathlib import Path

          page = Path("site/dag.html")
          text = page.read_text(encoding="utf-8")
          style = '  <link rel="stylesheet" href="assets/structure-observation.css">\n'
          if style.strip() not in text:
              anchor = '  <link rel="stylesheet" href="assets/atlas-structure.css">\n'
              if anchor not in text:
                  raise SystemExit("atlas stylesheet anchor is missing")
              text = text.replace(anchor, anchor + style, 1)
          core = '  <script defer src="assets/structure-observation-core.js"></script>\n'
          runtime = '  <script defer src="assets/structure-observation-runtime.js"></script>\n'
          if core.strip() not in text or runtime.strip() not in text:
              anchor = '  <script defer src="assets/dag.js"></script>\n'
              if anchor not in text:
                  raise SystemExit("Atlas runtime anchor is missing")
              addition = ""
              if core.strip() not in text:
                  addition += core
              if runtime.strip() not in text:
                  addition += runtime
              text = text.replace(anchor, anchor + addition, 1)
          page.write_text(text, encoding="utf-8")

          core_path = Path("site/assets/structure-observation-core.js")
          core_text = core_path.read_text(encoding="utf-8")
          core_text = core_text.replace(
              'left.localeCompare(right, "en", { sensitivity: "variant" })',
              'left < right ? -1 : left > right ? 1 : 0'
          )
          core_text = core_text.replace(
              'left.dependency_id.localeCompare(right.dependency_id, "en", { sensitivity: "variant" })\n      || left.dependent_id.localeCompare(right.dependent_id, "en", { sensitivity: "variant" })',
              '(left.dependency_id < right.dependency_id ? -1 : left.dependency_id > right.dependency_id ? 1 : 0)\n      || (left.dependent_id < right.dependent_id ? -1 : left.dependent_id > right.dependent_id ? 1 : 0)'
          )
          core_path.write_text(core_text, encoding="utf-8")

          runtime_path = Path("site/assets/structure-observation-runtime.js")
          runtime_text = runtime_path.read_text(encoding="utf-8")
          runtime_text = runtime_text.replace(
              'gesture: clusterId && !selected ? "cluster-peel" : "selection",',
              'gesture: "selection",'
          )
          runtime_text = runtime_text.replace(
              '      state.selectedPathRef = detailValue.path_ref || null;\n      state.gesture = "path-inspection";\n      refreshSelection();',
              '      const snapshot = exactSelection();\n      state.selectedNodeIds = snapshot.nodeIds;\n      state.selectedClusterIds = snapshot.clusterIds;\n      state.selectedEdges = snapshot.edges;\n      state.selectedPathRef = detailValue.path_ref || null;\n      state.gesture = "path-inspection";\n      state.sourceNodeIds = snapshot.sourceNodeIds;\n      state.targetNodeIds = snapshot.targetNodeIds;\n      state.sourceClusterIds = snapshot.sourceClusterIds;\n      state.targetClusterIds = snapshot.targetClusterIds;\n      updateButton();\n      updatePreview();'
          )
          runtime_path.write_text(runtime_text, encoding="utf-8")
          PY
          rm -f \
            .github/workflows/bootstrap-structure-observation.yml \
            .github/workflows/open-save-observation-pr.yml \
            .github/workflows/finalize-save-observation.yml
          node --check site/assets/structure-observation-core.js
          node --check site/assets/structure-observation-runtime.js
          node tests/js/structure-observation.test.js
          python -m unittest tests.test_structure_observation
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(pages): finalize explicit observation integration"
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:feat/save-structural-observations; then
              break
            fi
            git pull --rebase origin feat/save-structural-observations
            if [[ "$attempt" == 3 ]]; then exit 1; fi
          done
          base="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/28" --jq '.head.ref' 2>/dev/null || true)"
          if [[ -z "$base" ]]; then base='feat/spatial-atlas-exploration'; fi
          existing="$(gh pr list --head feat/save-structural-observations --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            cat > "$RUNNER_TEMP/body.md" <<'EOF'
          ## Purpose

          Add the explicit transition from local Atlas exploration into a saved human structural observation. Navigation, hover, camera movement, semantic zoom, drag, peel, comparison and path reading remain transient until the user presses `Save observation`.

          ## Delivered

          - `pages-human-structure-observation-request.v1` contract aligned with Intuition `human-structure-observation.v1` content;
          - explicit Save observation action, accessible dialog, human note, actor and privacy fields;
          - exact release, certified topology, Topology Atlas, Pages conformation and registered Atlas receipt coordinates;
          - node, cluster, certified-edge, comparison and selected-path capture;
          - fail-closed submission through the release-published `structure_observation_endpoint`;
          - no client-assigned canonical observation identity. The trusted intake computes it;
          - no automatic capture from drag, zoom, hover or camera state;
          - session-only actor convenience, with no observation payload persisted locally;
          - independent JavaScript and Python integration tests.

          ## Authority boundary

          - saving records human research evidence only;
          - no candidate edit, valuation, Formalize request or Base write is created;
          - derived affinity remains distinct from certified dependency;
          - local spatial offsets and camera coordinates are excluded from the request;
          - when the release does not publish an exact Intuition endpoint and Atlas receipt, the action stays disabled.

          Draft pending current-head CI. No auto-merge.
          EOF
            gh pr create \
              --base "$base" \
              --head feat/save-structural-observations \
              --title "feat(pages): explicitly save structural observations" \
              --body-file "$RUNNER_TEMP/body.md" \
              --draft
          fi
