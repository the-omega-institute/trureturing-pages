name: pages-ci

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore C# projects
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_READ_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
        run: dotnet restore Trureturing.Pages.slnx --configfile nuget.config

      - name: Build C# projects with warnings as errors
        run: dotnet build Trureturing.Pages.slnx -c Release --no-restore --warnaserror

      - name: Enforce Pages CLI and Core boundary
        run: dotnet test tests/Trureturing.Pages.ArchitectureTests/Trureturing.Pages.ArchitectureTests.csproj -c Release --no-build

      - name: Run fail-closed port and schema contract tests
        run: dotnet test tests/Trureturing.Pages.Tests/Trureturing.Pages.Tests.csproj -c Release --no-build

      - name: Check browser JavaScript
        run: |
          node --check site/assets/concept-lens.js
          node --check site/assets/dag.js
          node --check site/assets/dag-knowledge-link.js
          node --check site/assets/knowledge-map.js
          node --check site/assets/research-context.js
          node --check site/assets/research-console.js
          node --check site/assets/research-writeback.js
          node --check site/assets/research-writeback-ui.js

      - name: Run Atlas and release-bound research client tests
        run: |
          node tests/js/concept-lens.test.js
          node tests/js/research-context.test.js
          node tests/js/research-writeback.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile current Python sources
        run: python -m compileall -q lib tools tests

      - name: Projector tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Contract tests
        run: python -m unittest discover -s tests/contracts -p 'test_*.py'

      - name: Fail-closed regression tests
        run: python -m unittest discover -s tests/red -p 'test_*.py'

      - name: Build the mock truth-release basic DAG
        run: python -m lib.vertical_smoke build-basic tests/fixtures/truth-release _site

      - name: Render and audit static knowledge pages
        run: |
          python lib/human_labels.py \
            _site/data/truth-graph.v1.json \
            _site/data/truth-graph.v1.json \
            tests/fixtures \
            --blueprint-ref fixture
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site")
          graph = json.loads(
              (root / "data/truth-graph.v1.json").read_text(encoding="utf-8")
          )
          pages = list((root / "knowledge/node").glob("*/index.html"))
          release_pages = list((root / "release").glob("*/node/*/index.html"))
          assert len(pages) == len(graph["nodes"])
          assert len(release_pages) == len(graph["nodes"])
          assert (root / "knowledge/index.html").is_file()
          assert (root / "knowledge/index.v1.json").is_file()
          assert (root / "assets/concept-lens.js").is_file()
          assert (root / "assets/concept-lens.css").is_file()
          assert (root / "assets/research-context.js").is_file()
          assert (root / "assets/research-console.js").is_file()
          assert (root / "assets/research-console.css").is_file()
          assert (root / "assets/research-writeback.js").is_file()
          assert (root / "assets/research-writeback-ui.js").is_file()
          assert (root / "assets/research-writeback.css").is_file()
          assert (root / "data/research-agent.v1.json").is_file()
          assert all(node.get("knowledge_page") for node in graph["nodes"])
          PY

      - name: Run the package-backed topology smoke
        run: |
          dotnet tools/Trureturing.Topology.Runner/bin/Release/net10.0/Trureturing.Topology.Runner.dll \
            tests/fixtures/truth-release/truth-graph.v1.json \
            sha256:6263c6c313abc29ca5b27309f30012c643794d07916d5d9ea0cf01b0ce7d8d20 \
            config/algorithm-profile.v1.json \
            28375f4a25fec6fd4777da1d7a7b1b8a9e0d8f3b \
            _site/data/certified-topology.v1.json

      - name: Project the release-bound Pages atlas
        run: |
          dotnet src/Trureturing.Pages.Cli/bin/Release/net10.0/Trureturing.Pages.Cli.dll \
            project-atlas \
            _site/data/truth-graph.v1.json \
            _site/data/certified-topology.v1.json \
            _site/data/pages-atlas-view.v1.json \
            _site/data/pages-atlas-manifest.v1.json
          cp _site/data/pages-atlas-view.v1.json \
            _site/data/certified-topology-view.v1.json
          cp _site/data/pages-atlas-view.v1.json \
            _site/data/truth-graph.v1.json
          cmp _site/data/pages-atlas-view.v1.json \
            _site/data/certified-topology-view.v1.json
          cmp _site/data/pages-atlas-view.v1.json \
            _site/data/truth-graph.v1.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("_site/data")
          graph_bytes = (root / "pages-atlas-view.v1.json").read_bytes()
          graph = json.loads(graph_bytes)
          manifest = json.loads(
              (root / "pages-atlas-manifest.v1.json").read_text()
          )
          assert graph["schema_version"] == "pages-atlas-view.v1"
          assert manifest["schema_version"] == "pages-atlas-manifest.v1"
          assert manifest["atlas_graph_digest"] == (
              "sha256:" + hashlib.sha256(graph_bytes).hexdigest()
          )
          assert manifest["counts"]["certified_topology_nodes"] == 4
          assert all(
              "descendant_cost" in node
              for node in graph["nodes"]
              if node["kind"] == "truth"
          )
          PY
