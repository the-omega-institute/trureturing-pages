  <script>
    const archivedRoute = location.pathname.match(/^(.*\/)release\/([a-f0-9]{64})\/node\/([a-f0-9]{64})(?:\/(?:index\.html)?)?$/);
    if (archivedRoute) {
      const target = new URL(location.origin);
      target.pathname = archivedRoute[1] + 'library-version.html';
      target.search = location.search;
      target.hash = new URLSearchParams({ release: 'sha256:' + archivedRoute[2], slug: archivedRoute[3] });
      location.replace(target);
    }
  </script>
</head>
