<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematical Atlas</title><style>html{background:#090c10;color:#e0eaec}</style><script>
const source = new URL(location.href), target = new URL('atlas.html', location.href);
if (source.searchParams.has('lang')) target.searchParams.set('lang', source.searchParams.get('lang'));
const node = source.searchParams.get('node');
const state = new URLSearchParams({mode:'dependency'});
if (node) state.set('node', node);
target.hash = state.toString();
location.replace(target.href);
</script></head><body><p>Explore the knowledge graph in the <a href="atlas.html">Mathematical Atlas</a>.</p><script type="module" src="assets/i18n.mjs"></script></body></html>
